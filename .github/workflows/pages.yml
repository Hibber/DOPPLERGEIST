name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build static site
        run: |
          set -e
          mkdir -p _site/app
          cp -a docs/. _site/
          cp src/dopplergeist/web/index.html src/dopplergeist/web/style.css \
            src/dopplergeist/web/app.js src/dopplergeist/web/leaflet.css \
            src/dopplergeist/web/leaflet.js src/dopplergeist/web/leaflet-license.txt \
            _site/app/
          sed -i \
            -e 's|href="/style.css"|href="./style.css"|g' \
            -e 's|href="/leaflet.css"|href="./leaflet.css"|g' \
            -e 's|src="/leaflet.js"|src="./leaflet.js"|g' \
            -e 's|src="/app.js"|src="./app.js"|g' \
            _site/app/index.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
